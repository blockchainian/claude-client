name: Privacy
on:
  push:
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            aarch64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          archive="gitleaks_${version}_linux_${arch}.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSL "$release/$archive" -o "$archive"
          curl -fsSL "$release/gitleaks_${version}_checksums.txt" -o checksums.txt
          awk -v archive="$archive" '$2 == archive' checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test the privacy hook
        run: python3 -m unittest discover -s tests -p test_privacy.py
      - name: Scan commits for secrets and home paths
        run: |
          revisions=$(python3 .github/scripts/commit_range.py)
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--diff-merges=first-parent $revisions"
      - name: Scan added lines for private terms
        if: ${{ !cancelled() }}
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          revisions=$(python3 .github/scripts/commit_range.py)
          python3 .github/scripts/gitleaks-privacy.py git --log-opts="--diff-merges=first-parent $revisions"
